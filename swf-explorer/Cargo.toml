[package]
name = "swf-explorer"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
authors = ["XIMOD Team"]
description = "Extraction et réinjection des textes traduisibles d'un SWF Flash — futur outil de XIMOD Translator"
license = "MIT"

[dependencies]
# Interface graphique (même pile/version que BSA Explorer & ESM Explorer).
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_extras = "0.29"
# Dialogues de fichiers natifs (Ouvrir…, Enregistrer…).
rfd = "0.15"
# zlib (dé)compression pour les SWF « CWS ».
flate2 = "1"
# Sérialisation des textes extraits (JSON) et lecture des éditions.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Lecture/écriture CSV (édition humaine des textes).
csv = "1"
# Gestion d'erreurs.
anyhow = "1"

[lib]
name = "swf_explorer"
path = "src/lib.rs"
