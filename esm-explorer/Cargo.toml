[package]
name = "esm-explorer"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
authors = ["XIMOD Team"]
description = "Standalone explorer for Bethesda plugin files (.esp/.esm/.esl) — future XIMOD Translator tool"
license = "MIT"

[dependencies]
# Shared game definitions (identifiers, specs, translatable fields) — one source of truth
ximod-games = { path = "../ximod-games" }

# GUI (same stack/version as XIMOD Translator, for a painless later integration)
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_extras = { version = "0.29" }

# ESP/ESM: zlib decompression of compressed records
flate2 = "1.0"

# Error handling in the vendored parser
anyhow = "1.0"

# Native file dialog (Open plugin…)
rfd = "0.15"

# Memory-map plugins so huge files (e.g. 1.35 GB Starfield.esm) open instantly
# and stay paged on demand instead of being read fully into RAM.
memmap2 = "0.9"

# BSA/BA2 reading (pure Rust, 0BSD) — to pull STRINGS out of archives when a
# localized plugin ships them packed (e.g. vanilla Starfield localization).
ba2 = "3"

# Spreadsheet export (.xlsx, opens in Excel and LibreOffice Calc).
rust_xlsxwriter = "0.79"

[lib]
name = "esm_explorer"
path = "src/lib.rs"
