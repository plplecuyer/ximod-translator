# Vérification continue (S-02, R-S02-01) : build, clippy sans avertissement et
# tests sur les trois systèmes, à chaque push et pull request.
name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libasound2-dev libssl-dev pkg-config
      - name: Build
        run: cargo build --workspace --locked
      - name: Clippy (aucun avertissement toléré)
        run: cargo clippy --all-targets --workspace --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Build avec le lecteur SQLite (GOG Galaxy / Lutris)
        run: cargo build --workspace --locked --features gog-galaxy
